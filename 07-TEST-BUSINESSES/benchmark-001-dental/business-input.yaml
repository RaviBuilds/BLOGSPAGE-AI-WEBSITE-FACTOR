# =============================================================================
# BUSINESS DESCRIPTION & CONTEXT
# =============================================================================

businessDescription: >
  Meridian Dental Studio was founded in 2016 by Dr. Sarah Mitchell with a vision 
  to provide exceptional dental care that combines clinical expertise with genuine 
  patient comfort. What started as a single-chair practice in the Harbor District 
  has grown into a two-location studio serving over 3,000 patients annually.
  
  
  The practice specializes in transformative cosmetic dentistry while maintaining 
  a foundation of comprehensive general care. Dr. Mitchell assembled a team of 
  specialists who share her philosophy: that exceptional dentistry requires both 
  technical precision and an understanding of each patient's unique goals and 
  concerns. Every treatment plan is collaborative, personalized, and designed to 
  deliver results that look natural and feel right.
  
  
  Meridian's approach combines advanced technology with unhurried appointments. 
  The practice invested early in digital smile design, intraoral scanning, and 
  same-day crown technology—not just for efficiency, but to give patients clarity 
  and confidence in their treatment journey. Most cosmetic consultations include 
  a digital preview of expected results, and every patient receives a dedicated 
  treatment coordinator who guides them from first visit through final result.

businessHistory: >
  Dr. Mitchell opened Meridian after spending six years in a large corporate 
  dental group, where she felt the pressure to rush appointments and upsell 
  treatments. She wanted to build something different: a practice where clinical 
  decisions were never compromised by production targets, and where patients 
  felt genuinely cared for rather than processed.
  
  
  The Harbor District location opened with just Dr. Mitchell and one assistant. 
  Within two years, patient referrals required adding Dr. James Chen, a 
  restorative specialist, and expanding to a three-operatory space. By 2020, 
  demand for evening appointments led to opening the Riverside Crossing location, 
  designed specifically for working professionals. Dr. Emily Rodriguez joined in 
  2022, bringing expertise in sedation dentistry and full-mouth rehabilitation.

# =============================================================================
# BUSINESS GOALS & CONVERSION
# =============================================================================

primaryGoal:
  type: CONSULTATION_BOOKINGS
  focus: Cosmetic procedures (veneers, smile makeovers, whitening)
  conversionJourney: HIGH_CONSIDERATION
  note: >
    Visitors need substantial trust-building before booking. Multiple decision 
    factors: practitioner expertise, technology, proven results, patient comfort, 
    location convenience, and cost transparency. Creative Direction must decide 
    how to build trust before asking for conversion.

secondaryGoals:
  - type: NEW_PATIENT_REGISTRATION
    focus: General dentistry and family care
  - type: EMERGENCY_APPOINTMENTS
    focus: Urgent dental care for existing and new patients

conversionContext: >
  Cosmetic dentistry is a high-investment, trust-dependent decision. Patients 
  typically research for weeks or months before committing. They evaluate 
  before/after results, read detailed practitioner credentials, and often 
  consult multiple practices. The website must demonstrate expertise, showcase 
  outcomes, explain processes clearly, and make the consultation step feel 
  low-risk and welcoming.

# =============================================================================
# TARGET AUDIENCE & BUSINESS CONTEXT
# =============================================================================

targetAudience:
  primarySegment:
    demographics: Professionals age 30-55
    lifestage: Established careers, disposable income for elective care
    motivations:
      - Confidence in professional and social settings
      - Correcting long-standing cosmetic concerns
      - Maintaining youthful appearance
      - Addressing functional issues (worn teeth, bite problems)
    concerns:
      - Treatment pain and recovery time
      - Natural-looking results (avoiding "fake" appearance)
      - Cost and payment options
      - Time commitment (busy schedules)
    decisionFactors:
      - Practitioner credentials and specialization
      - Before/after evidence of similar cases
      - Technology and techniques used
      - Patient testimonials emphasizing outcomes and experience
      - Consultation process (what to expect)
      
  secondarySegment:
    demographics: Families seeking comprehensive general care
    motivations: Preventive care, family-friendly environment, insurance acceptance
    

